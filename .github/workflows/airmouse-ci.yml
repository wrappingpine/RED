# CI/CD Configuration for AirMouse
# GitHub Actions workflow for automated testing and validation

name: AirMouse CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  # Python version
  PYTHON_VERSION: "3.12"
  
  # Testing configuration
  TEST_TIMEOUT: 300  # seconds
  CHROMIUM_VERSION: "124.0.6367.64"

jobs:
  # Linting and code quality
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            setup.py
            setup.cfg
            pyproject.toml
          
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .[dev]
          
      - name: Run black (code formatting)
        run: black --check .
        
      - name: Run flake8 (code quality)
        run: flake8 .
        
      - name: Run isort (import sorting)
        run: isort --check-only .
        
      - name: Type checking with mypy
        run: mypy airmouse/
        
  # Unit tests
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            setup.py
            setup.cfg
            pyproject.toml
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-glx libglib2.0-0
          
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .[dev]
      
      - name: Run unit tests with pytest
        run: |
          pytest airmouse/tests/ \
            --tb=short \
            --timeout=${{ env.TEST_TIMEOUT }} \
            --cov=airmouse \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-config=.coveragerc
      
      - name: Upload coverage report
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
  
  # Integration tests with hardware simulation
  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            setup.py
            setup.cfg
            pyproject.toml
      
      - name: Install system dependencies for OpenCV and camera support
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-glx libglib2.0-0
          sudo apt-get install -y ffmpeg libavcodec-extra
      
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .[dev]
      
      - name: Run integration tests (simulate camera hardware)
        run: |
          # Create mock camera for testing
          mkdir -p /tmp/test_camera
          export PYTHONPATH=/home/runner/work/airmouse:$PYTHONPATH
          
          # Run integration tests with hardware simulation
          pytest airmouse/tests/test_integration.py \
            --tb=short \
            --timeout=${{ env.TEST_TIMEOUT }} \
            -v
      
      - name: Run pipeline simulation tests
        run: |
          pytest airmouse/tests/test_pyramid_simulation.py \
            --tb=short \
            --timeout=${{ env.TEST_TIMEOUT }} \
            -v
      
  # Hardware-in-the-loop simulation
  hardware-simulation:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            setup.py
            setup.cfg
            pyproject.toml
      
      - name: Install hardware simulation dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .[dev]
          
          # Install additional packages for hardware simulation
          pip install pygame
          pip install pyvirtualdisplay
          pip install python-uinput
      
      - name: Prepare hardware simulation environment
        run: |
          # Create virtual display for GUI testing
          export DISPLAY=:99
          Xvfb :99 -screen 0 1024x768x24 &
          sleep 2
          
      - name: Run hardware-in-the-loop tests
        run: |
          pytest airmouse/tests/ \
            --tb=short \
            --timeout=${{ env.TEST_TIMEOUT }} \
            -v \
            --ignore=airmouse/tests/test_integration.py \
            --ignore=airmouse/tests/test_pyramid_simulation.py
      
      - name: Cleanup virtual display
        if: always()
        run: kill $! || true
  
  # Performance and vibration testing
  vibration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            setup.py
            setup.cfg
            pyproject.toml
      
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .[dev]
      
      - name: Run cursor vibration tests
        run: |
          pytest airmouse/tests/test_cursor_vibration.py \
            --tb=short \
            --timeout=${{ env.TEST_TIMEOUT }} \
            -v \
            --cov=airmouse.control.cursor \
            --cov-report=term-missing \
            --cov-report=xml
      
      - name: Run gesture hysteresis tests
        run: |
          pytest airmouse/tests/test_gesture_hysteresis.py \
            --tb=short \
            --timeout=${{ env.TEST_TIMEOUT }} \
            -v
      
      - name: Run smoothing algorithm tests
        run: |
          pytest airmouse/tests/test_cursor_smoothing.py \
            --tb=short \
            --timeout=${{ env.TEST_TIMEOUT }} \
            -v

  # Latency benchmark gate (SC-003, Principle IV)
  latency-gate:
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            setup.py
            setup.cfg
            pyproject.toml
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-glx libglib2.0-0
          
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .[dev]
      
      - name: Run latency benchmark
        id: latency
        run: |
          # Run benchmark with mocked camera for CI
          python benchmark_full.py --iterations 5 --ci 2>&1 | tee benchmark.log
          
          # Extract P95 latency from benchmark output
          P95=$(grep -oE 'P95=[0-9]+' benchmark.log | cut -d= -f2)
          echo "P95 latency: ${P95}ms"
          echo "p95_latency=${P95}" >> $GITHUB_OUTPUT
          
          # Fail if P95 > 50ms
          if [ -n "$P95" ] && [ "$P95" -gt 50 ]; then
            echo "::error::P95 latency ${P95}ms exceeds 50ms budget"
            exit 1
          fi
          
          if [ -z "$P95" ]; then
            echo "::warning::Could not extract P95 latency from benchmark output"
          fi

  # Security scanning
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run safety audit
        run: |
          pip install safety
          safety check
      
      - name: Run bandit security scan
        run: |
          pip install bandit
          bandit -r airmouse/ -f json -o bandit-report.json
      
      - name: Upload security report
        uses: actions/upload-artifact@v3
        with:
          name: security-report
          path: bandit-report.json
  
  # Test coverage reporting
  coverage-report:
    runs-on: ubuntu-latest
    needs: [unit-tests, vibration-tests]
    if: github.event_name == 'push'
    
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .[dev]
      
      - name: Generate coverage report
        run: |
          pytest airmouse/tests/ \
            --tb=short \
            --cov=airmouse \
            --cov-report=html \
            --cov-config=.coveragerc
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: airmouse-coverage
      
      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 30
  
  # Deployment preparation
  deploy:
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, integration-tests, vibration-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Create distribution packages
        run: |
          python setup.py sdist bdist_wheel
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: airmouse-dist
          path: dist/
          retention-days: 30
      
      - name: Deploy to PyPI (optional)
        if: secrets.PYPI_API_TOKEN
        run: |
          pip install twine
          twine upload --repository pypi dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}